[project]
name = "ai-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vvadr", email = "abdulazizyusupaliev009@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets[audio]>=5.0.1",
    "evaluate>=0.4.6",
    "imageio-ffmpeg>=0.6.0",
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.19.0",
]

[project.scripts]
ai-ml = "ai_ml:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
